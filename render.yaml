services:
  - type: web
    name: torezani-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --workspace apps/api --include-workspace-root && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace apps/api
    startCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
