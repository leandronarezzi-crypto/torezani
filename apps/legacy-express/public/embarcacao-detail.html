<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhes da Embarcação - Torezani Apoio Marítimo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="img/logo-mark.png" alt="Torezani" title="Torezani Apoio Marítimo" class="sidebar-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="sidebar-logo-fallback" style="display:none" title="Torezani Apoio Marítimo">T</div>
        <span class="sidebar-brand-label">Torezani<small>Apoio Marítimo</small></span>
      </div>
      <a href="index.html" class="sidebar-link" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
        <span class="sidebar-link-label">Dashboard</span>
      </a>
      <a href="embarcacoes.html" class="sidebar-link active" title="Embarcações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><line x1="12" y1="7.2" x2="12" y2="21"/><line x1="8" y1="10" x2="16" y2="10"/><path d="M4 13a8 8 0 0 0 8 8 8 8 0 0 0 8-8"/></svg>
        <span class="sidebar-link-label">Embarcações</span>
      </a>
      <a href="mapa.html" class="sidebar-link" title="Mapa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-7.5-7-12a7 7 0 0 1 14 0c0 4.5-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <span class="sidebar-link-label">Mapa</span>
      </a>
      <a href="admin.html" class="sidebar-link admin-only" style="display:none" title="Administração">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        <span class="sidebar-link-label">Administração</span>
      </a>
      <button id="btn-logout-sidebar" class="sidebar-link" style="margin-top:auto" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="sidebar-link-label">Sair</span>
      </button>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div id="vessel-header" class="flex items-center justify-between gap-4 flex-wrap flex-1"></div>
        <button id="btn-logout" class="avatar-circle" title="Sair">--</button>
      </header>

      <main class="app-content">
        <p id="page-error" class="text-red-600 mb-4 hidden"></p>

        <div id="engine-tabs" class="flex gap-2 mb-6"></div>
        <div id="engine-panel" class="space-y-6 mb-10"></div>

        <section>
          <div class="card">
            <div class="card-header">
              <h2>Histórico de Casco / Pintura</h2>
              <button id="btn-novo-casco-pintura" class="btn-primary write-only">+ Novo Registro</button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left data-table">
                <thead>
                  <tr>
                    <th class="px-4 py-3">Tipo</th>
                    <th class="px-4 py-3">Data Execução</th>
                    <th class="px-4 py-3">Horímetro</th>
                    <th class="px-4 py-3">Vencimento</th>
                    <th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3 text-right">Ações</th>
                  </tr>
                </thead>
                <tbody id="casco-pintura-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <script type="module" src="js/embarcacao-detail.js"></script>
</body>
</html>
