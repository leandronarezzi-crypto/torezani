name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping torezani-api
        run: curl -sf --max-time 30 https://torezani-api.onrender.com/api/auth/me -o /dev/null -w "status: %{http_code}\n" || true
